name: cadeboard

services:
  db:
    image: postgres:18.4-trixie
    container_name: cadeboard-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-cadeboard}
      POSTGRES_USER: ${POSTGRES_USER:-cadeboard}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-cadeboard_dev_password}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  api:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: cadeboard-api
    restart: unless-stopped
    environment:
      NODE_ENV: ${NODE_ENV:-development}
      API_PORT: ${API_PORT:-3000}
      API_CORS_ORIGIN: ${API_CORS_ORIGIN:-http://localhost:4200}
      DATABASE_URL: ${DATABASE_URL:-postgresql://cadeboard:cadeboard_dev_password@db:5432/cadeboard?schema=public}
    ports:
      - "127.0.0.1:${API_PORT:-3000}:${API_PORT:-3000}"
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "node -e \"fetch('http://127.0.0.1:' + (process.env.API_PORT || 3000) + '/api/v1/health').then((response) => process.exit(response.ok ? 0 : 1)).catch(() => process.exit(1))\"",
        ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  web:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        API_BASE_URL: ${API_BASE_URL:-/api/v1}
    container_name: cadeboard-web
    restart: unless-stopped
    environment:
      API_PROXY_PASS: ${API_PROXY_PASS:-http://api:3000}
    ports:
      - "127.0.0.1:${WEB_PORT:-4200}:8080"
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget --quiet --spider http://127.0.0.1:8080/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s

volumes:
  postgres_data:
